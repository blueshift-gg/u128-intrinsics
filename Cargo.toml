[package]
name = "u128-intrinsics"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pinocchio = "0.9.2"

[dev-dependencies]
mollusk-svm = "0.9.0"
solana-instruction = "3.1.0"
agave-feature-set = "3.1.5"
solana-program-error = "3.0.0"

# Patch section to override Solana runtime crates with blueshift forks.
# This allows testing JIT and interpreter modifications locally.
#
# mollusk-svm 0.9.0 uses solana-program-runtime v3.1.5 and solana-sbpf v0.13.1
[patch.crates-io]
# SBPF VM (contains JIT compiler and interpreter)
solana-sbpf = { git = "https://github.com/blueshift-gg/solana-sbpf", branch = "u128-intrinsics" }

# Core program runtime (uses solana-sbpf)
solana-program-runtime = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }

# Required SVM crates (mollusk uses these directly, must match program-runtime versions)
solana-svm-callback = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
solana-svm-feature-set = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
solana-svm-log-collector = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
solana-svm-timings = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
solana-svm-transaction = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }

# Other required agave crates (avoid version conflicts)
solana-transaction-context = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
solana-system-program = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
agave-syscalls = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
solana-bpf-loader-program = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }
agave-feature-set = { git = "https://github.com/blueshift-gg/agave", branch = "u128-intrinsics" }